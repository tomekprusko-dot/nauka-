<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Zadania</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2575fc">

  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zadania">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-row">
        <div>
          <h1>Zadania</h1>
          <p class="today-label" id="todayLabel"></p>
        </div>
        <button class="icon-btn" id="settingsBtn" aria-label="Ustawienia">⚙</button>
      </div>
    </header>

    <nav class="daystrip" id="dayStrip"></nav>

    <div class="tag-filter-strip" id="tagFilterStrip">
      <button type="button" class="tag-filter-chip active" data-tag="all">Wszystkie</button>
      <button type="button" class="tag-filter-chip" data-tag="praca">💼 Praca</button>
      <button type="button" class="tag-filter-chip" data-tag="prywatne">🏠 Prywatne</button>
    </div>

    <main class="content" id="content"></main>

    <button class="fab" id="addBtn" aria-label="Dodaj zadanie">+</button>
  </div>

  <div class="sheet-overlay" id="sheetOverlay">
    <div class="sheet" id="sheet">
      <div class="sheet-handle"></div>
      <h2 id="sheetTitle">Nowe zadanie</h2>
      <form id="taskForm">
        <label>
          Co trzeba zrobić?
          <input type="text" id="taskTitle" placeholder="np. Zadzwonić do..." required maxlength="200">
        </label>
        <label>
          Notatka (opcjonalnie)
          <textarea id="taskNote" placeholder="Dodatkowe szczegóły" maxlength="500" rows="2"></textarea>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="taskNoDate">
          <span>Zadanie ogólne (bez konkretnej daty)</span>
        </label>
        <div class="sheet-row" id="dateTimeRow">
          <label>
            Data
            <input type="date" id="taskDate">
          </label>
          <label>
            Godzina (opcjonalnie)
            <input type="time" id="taskTime">
          </label>
        </div>
        <div class="tag-row">
          <span class="tag-row-label">Tag</span>
          <div class="tag-options" id="tagOptions">
            <button type="button" class="tag-chip active" data-tag="">Bez tagu</button>
            <button type="button" class="tag-chip" data-tag="praca">💼 Praca</button>
            <button type="button" class="tag-chip" data-tag="prywatne">🏠 Prywatne</button>
          </div>
        </div>
        <div class="sheet-actions">
          <button type="button" class="btn-secondary" id="cancelBtn">Anuluj</button>
          <button type="submit" class="btn-primary" id="saveBtn">Zapisz</button>
        </div>
        <button type="button" class="delete-link hidden" id="deleteInSheetBtn">Usuń zadanie</button>
      </form>
    </div>
  </div>

  <div class="sheet-overlay" id="settingsOverlay">
    <div class="sheet" id="settingsSheet">
      <div class="sheet-handle"></div>
      <h2>Ustawienia</h2>
      <p class="settings-info">Zadań łącznie: <b id="taskCount">0</b></p>
      <div class="settings-list">
        <button type="button" class="btn-secondary settings-btn" id="exportBtn">⬇️&nbsp; Eksportuj kopię zapasową</button>
        <button type="button" class="btn-secondary settings-btn" id="importBtn">⬆️&nbsp; Importuj kopię zapasową</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
      <div class="sheet-actions">
        <button type="button" class="btn-primary" id="settingsCloseBtn">Zamknij</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
